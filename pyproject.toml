[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filesearch"
version = "0.1.0"
description = "AI-based file system search: scans your files, tags them with a local Ollama model (chosen by llm-checker), and lets you search by keyword or meaning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samit Mohnot" }]
keywords = ["file-search", "semantic-search", "ai", "ollama", "llm", "indexing", "full-text-search", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Desktop Environment :: File Managers",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "watchdog>=4.0",
    "ollama>=0.3.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "charset-normalizer>=3.3",
    "Pillow>=10.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pywebview>=5.1",
    "numpy>=1.26",
]

[project.scripts]
filesearch = "filesearch.cli:app"

[project.urls]
Homepage = "https://github.com/AnotherSamWithADream/filesearch"
Repository = "https://github.com/AnotherSamWithADream/filesearch"
Issues = "https://github.com/AnotherSamWithADream/filesearch/issues"
Changelog = "https://github.com/AnotherSamWithADream/filesearch/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["filesearch*"]

[tool.setuptools.package-data]
"filesearch.web" = ["static/*"]
